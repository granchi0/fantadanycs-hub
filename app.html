  <style>
    :root {
      --bg-base: #0B0E17;
      --bg-surface: #131826;
      --bg-card: #1A2234;
      --bg-card-hover: #232E47;
      --border-subtle: #2A364F;
      --border-accent: #3E517A;
      
      --text-primary: #F3F5FA;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --accent-blue: #3B82F6;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #EF4444;

      --role-p: #F59E0B;
      --role-d: #10B981;
      --role-c: #3B82F6;
      --role-a: #EF4444;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.6);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    .navbar {
      background: rgba(19, 24, 38, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }

    .nav-stats {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--bg-card);
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
    }

    /* Main Container */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem;
      width: 100%;
      flex: 1;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.75rem;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-filter {
      padding: 0.65rem 1.1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
      user-select: none;
    }

    .btn-filter:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .btn-filter.active {
      background: var(--accent-blue);
      color: #FFFFFF;
      border-color: var(--accent-blue);
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
    }

    .role-badge-p { background: rgba(245, 158, 11, 0.2); color: var(--role-p); }
    .role-badge-d { background: rgba(16, 185, 129, 0.2); color: var(--role-d); }
    .role-badge-c { background: rgba(59, 130, 246, 0.2); color: var(--role-c); }
    .role-badge-a { background: rgba(239, 68, 68, 0.2); color: var(--role-a); }

    .btn-filter.active-p { background: var(--role-p); color: #111; border-color: var(--role-p); }
    .btn-filter.active-d { background: var(--role-d); color: #FFF; border-color: var(--role-d); }
    .btn-filter.active-c { background: var(--role-c); color: #FFF; border-color: var(--role-c); }
    .btn-filter.active-a { background: var(--role-a); color: #FFF; border-color: var(--role-a); }

    /* Teams Bar */
    .teams-carousel {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }

    .team-chip {
      padding: 0.45rem 0.85rem;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .team-chip:hover {
      border-color: var(--border-accent);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .team-chip.active {
      background: #FFFFFF;
      color: #0B0E17;
      border-color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(255,255,255,0.25);
    }

    .team-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Secondary filters */
    .secondary-filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .toggle-checkbox {
      appearance: none;
      width: 38px;
      height: 20px;
      background: var(--border-subtle);
      border-radius: var(--radius-full);
      position: relative;
      cursor: pointer;
      outline: none;
      transition: var(--transition);
    }

    .toggle-checkbox:checked {
      background: var(--accent-emerald);
    }

    .toggle-checkbox::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      background: #FFFFFF;
      transition: var(--transition);
    }

    .toggle-checkbox:checked::before {
      transform: translateX(18px);
    }

    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Players Grid */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.15rem;
    }

    /* Player Card */
    .player-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.15rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .player-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-accent);
    }

    .player-card:hover .player-name {
      color: #FFFFFF;
    }

    .card-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .player-name-block {
      flex: 1;
    }

    .player-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 0.25rem;
    }

    .player-team {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .role-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mantra-roles {
      display: inline-flex;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .player-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin: 0.85rem 0;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 0.6rem;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.15rem;
    }

    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-val.price {
      color: var(--accent-emerald);
    }

    .player-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .tier-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.05);
      color: var(--text-secondary);
    }

    .starter-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-emerald);
    }

    .starter-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-emerald);
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-subtle);
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>

    const playersData = DB.players;
    const teamsMeta = DB.teams;

    // State
    let currentRole = "ALL";
    let currentTeam = "ALL";
    let onlyStarters = true;
    let searchQuery = "";
    let currentSort = "fvm_desc";

    // DOM Elements
    const searchInput = document.getElementById("searchInput");
    const roleFilters = document.getElementById("roleFilters");
    const teamsList = document.getElementById("teamsList");
    const starterToggle = document.getElementById("starterToggle");
    const sortSelect = document.getElementById("sortSelect");
    const playersGrid = document.getElementById("playersGrid");
    const totalCountEl = document.getElementById("totalCount");
    const startersCountEl = document.getElementById("startersCount");

    // Init Teams Carousel
    function initTeams() {
      teamsList.innerHTML = "";
      const allChip = document.createElement("button");
      allChip.className = "team-chip active";
      allChip.innerHTML = "Tutte le Squadre";
      allChip.onclick = () => selectTeam("ALL", allChip);
      teamsList.appendChild(allChip);

      const sortedTeams = Object.keys(teamsMeta).sort();
      sortedTeams.forEach(tKey => {
        const t = teamsMeta[tKey];
        const chip = document.createElement("button");
        chip.className = "team-chip";
        chip.innerHTML = '<span class="team-dot" style="background: ' + t.color + '"></span> ' + t.name;
        chip.onclick = () => selectTeam(t.name, chip);
        teamsList.appendChild(chip);
      });
    }

    function selectTeam(teamName, element) {
      currentTeam = teamName;
      document.querySelectorAll(".team-chip").forEach(c => c.classList.remove("active"));
      element.classList.add("active");
      render();
    }

    // Role Buttons
    roleFilters.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-filter");
      if (!btn) return;
      currentRole = btn.dataset.role;

      document.querySelectorAll("#roleFilters .btn-filter").forEach(b => {
        b.className = "btn-filter";
      });

      if (currentRole === "ALL") btn.classList.add("active");
      else if (currentRole === "P") btn.classList.add("active-p");
      else if (currentRole === "D") btn.classList.add("active-d");
      else if (currentRole === "C") btn.classList.add("active-c");
      else if (currentRole === "A") btn.classList.add("active-a");

      render();
    });

    // Inputs listeners
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    starterToggle.addEventListener("change", (e) => {
      onlyStarters = e.target.checked;
      render();
    });

    sortSelect.addEventListener("change", (e) => {
      currentSort = e.target.value;
      render();
    });

    function getRoleBadgeClass(r) {
      if (r === "P") return "role-badge-p";
      if (r === "D") return "role-badge-d";
      if (r === "C") return "role-badge-c";
      if (r === "A") return "role-badge-a";
      return "";
    }

    function getRoleStripeColor(r) {
      if (r === "P") return "#F59E0B";
      if (r === "D") return "#10B981";
      if (r === "C") return "#3B82F6";
      if (r === "A") return "#EF4444";
      return "#64748B";
    }

    function getFantalabSearch(player) {
      var q = encodeURIComponent("fantalab " + player.nome + " " + player.squadra + " 2026 2027 quotazione");
      return "https://www.google.com/search?q=" + q;
    }

    function render() {
      let filtered = playersData.filter(p => {
        if (currentRole !== "ALL" && p.ruolo !== currentRole) return false;
        if (currentTeam !== "ALL" && p.squadra.toLowerCase() !== currentTeam.toLowerCase()) return false;
        if (onlyStarters && !p.isStarter) return false;
        if (searchQuery) {
          const normName = p.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const normQuery = searchQuery.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          if (!normName.includes(normQuery) && !p.squadra.toLowerCase().includes(normQuery)) {
            return false;
          }
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (currentSort === "fvm_desc") return b.fvm - a.fvm;
        if (currentSort === "price_desc") return b.prezzo500 - a.prezzo500;
        if (currentSort === "qt_desc") return b.qtA - a.qtA;
        if (currentSort === "name_asc") return a.nome.localeCompare(b.nome);
        if (currentSort === "team_asc") return a.squadra.localeCompare(b.squadra);
        return 0;
      });

      totalCountEl.textContent = filtered.length;
      startersCountEl.textContent = filtered.filter(p => p.isStarter).length;

      if (filtered.length === 0) {
        playersGrid.innerHTML = '<div class="empty-state"><h3>Nessun calciatore trovato</h3><p>Prova a modificare i filtri di ricerca o disattiva il filtro "Solo Titolari".</p></div>';
        return;
      }

      let cardsHtml = "";
      for (let i = 0; i < filtered.length; i++) {
        const p = filtered[i];
        const teamInfo = teamsMeta[p.squadra] || { color: "#3B82F6", name: p.squadra };
        const stripeColor = getRoleStripeColor(p.ruolo);
        const fantalabUrl = getFantalabSearch(p);
        const starterHtml = p.isStarter
          ? '<span class="starter-badge"><span class="starter-dot"></span> Titolare</span>'
          : '<span style="color: var(--text-muted); font-size: 0.72rem;">Rotazione</span>';

        cardsHtml += '<a class="player-card" href="' + fantalabUrl + '" target="_blank" rel="noopener">' +
          '<div class="card-stripe" style="background: ' + stripeColor + ';"></div>' +
          '<div>' +
            '<div class="player-header">' +
              '<div class="player-name-block">' +
                '<div class="player-name">' + p.nome + '</div>' +
                '<div class="player-team">' +
                  '<span class="team-dot" style="background: ' + teamInfo.color + '; width: 8px; height: 8px;"></span>' +
                  p.squadra +
                '</div>' +
                '<div class="mantra-roles">Mantra: ' + p.ruoloMantra + '</div>' +
              '</div>' +
              '<span class="role-badge ' + getRoleBadgeClass(p.ruolo) + '">' + p.ruolo + '</span>' +
            '</div>' +
            '<div class="player-stats-grid">' +
              '<div class="stat-box">' +
                '<span class="stat-label">Prezzo (500)</span>' +
                '<span class="stat-val price">' + p.prezzo500 + ' cr</span>' +
              '</div>' +
              '<div class="stat-box">' +
                '<span class="stat-label">FVM Cons.</span>' +
                '<span class="stat-val">' + p.fvm + '</span>' +
              '</div>' +
              '<div class="stat-box">' +
                '<span class="stat-label">Quotazione</span>' +
                '<span class="stat-val">' + p.qtA + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="player-footer">' +
            '<span class="tier-tag">' + p.tier + '</span>' +
            starterHtml +
          '</div>' +
        '</a>';
      }

      playersGrid.innerHTML = cardsHtml;
    }

    // Initialize
    initTeams();
    render();
  </script>
</body>
</html>
